<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Remote Bot Joiner</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0f1115;
      --panel: #181b22;
      --line: #303642;
      --text: #f4f7fb;
      --muted: #9aa6b7;
      --blue: #58a6ff;
      --green: #65d46e;
      --red: #ff6969;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(440px, 100%);
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      padding: 22px;
      box-shadow: 0 24px 60px -40px rgba(0, 0, 0, .9);
    }

    h1 {
      margin: 0 0 4px;
      font-size: 28px;
      letter-spacing: 0;
    }

    .sub {
      margin: 0 0 22px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }

    label {
      display: block;
      margin-bottom: 7px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    .field { margin-bottom: 14px; }

    input {
      width: 100%;
      min-height: 46px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #0b0d11;
      color: var(--text);
      padding: 11px 12px;
      font: inherit;
      outline: none;
    }

    input:focus { border-color: var(--blue); }
    input:disabled { opacity: .65; }

    .buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 4px;
    }

    button {
      min-height: 46px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #222733;
      color: var(--text);
      font: inherit;
      font-weight: 800;
      cursor: pointer;
    }

    button.primary {
      background: var(--blue);
      border-color: var(--blue);
      color: #07101d;
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .status {
      margin-top: 18px;
      min-height: 74px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #10131a;
      padding: 13px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.45;
      overflow-wrap: anywhere;
    }

    .status strong {
      display: block;
      margin-bottom: 4px;
      color: var(--text);
    }

    .status.connected strong { color: var(--green); }
    .status.error strong { color: var(--red); }

    @media (max-width: 430px) {
      body { padding: 14px; }
      main { padding: 18px; }
      h1 { font-size: 24px; }
      .buttons { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Remote Bot Joiner</h1>
    <p class="sub">Enter a game code and bot name. This page only joins and leaves the remote game.</p>

    <div class="field">
      <label for="gameCode">Game code</label>
      <input id="gameCode" maxlength="32" autocomplete="off" placeholder="JG3156JLDX" />
    </div>

    <div class="field">
      <label for="botName">Bot name</label>
      <input id="botName" maxlength="24" autocomplete="off" value="Remote Bot" />
    </div>

    <div class="buttons">
      <button class="primary" id="joinBtn">Join</button>
      <button id="leaveBtn" disabled>Leave</button>
    </div>

    <div class="status" id="statusBox">
      <strong>Disconnected</strong>
      Waiting for a game code.
    </div>
  </main>

  <script>
    const gameCode = document.getElementById('gameCode');
    const botName = document.getElementById('botName');
    const joinBtn = document.getElementById('joinBtn');
    const leaveBtn = document.getElementById('leaveBtn');
    const statusBox = document.getElementById('statusBox');

    let remoteSession = null;

    async function api(path, body) {
      const res = await fetch(path, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body || {}),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || res.statusText);
      return data;
    }

    function setBusy(isBusy) {
      joinBtn.disabled = isBusy || Boolean(remoteSession);
      leaveBtn.disabled = isBusy || !remoteSession;
      gameCode.disabled = isBusy || Boolean(remoteSession);
      botName.disabled = isBusy || Boolean(remoteSession);
    }

    function setStatus(kind, title, detail) {
      statusBox.className = `status ${kind || ''}`.trim();
      statusBox.innerHTML = `<strong>${escapeHtml(title)}</strong>${escapeHtml(detail)}`;
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, (char) => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#039;',
      }[char]));
    }

    joinBtn.addEventListener('click', async () => {
      const code = gameCode.value.trim().toUpperCase();
      const name = botName.value.trim();
      if (!code) return setStatus('error', 'Missing code', 'Enter a game code first.');
      if (!name) return setStatus('error', 'Missing name', 'Enter a bot name first.');

      setBusy(true);
      setStatus('', 'Joining', `Connecting ${name} to ${code}...`);
      try {
        remoteSession = await api('/api/stax/join', { gameCode: code, name });
        setStatus(
          'connected',
          'Connected',
          `${remoteSession.name} joined ${remoteSession.gameCode}. Player id: ${remoteSession.userId}`
        );
      } catch (err) {
        remoteSession = null;
        setStatus('error', 'Join failed', err.message);
      } finally {
        setBusy(false);
      }
    });

    leaveBtn.addEventListener('click', async () => {
      if (!remoteSession) return;
      const leaving = remoteSession;

      setBusy(true);
      setStatus('', 'Leaving', `Disconnecting ${leaving.name}...`);
      try {
        await api('/api/stax/leave', { sessionId: leaving.sessionId });
        remoteSession = null;
        setStatus('', 'Disconnected', `${leaving.name} left ${leaving.gameCode}.`);
      } catch (err) {
        setStatus('error', 'Leave failed', err.message);
      } finally {
        setBusy(false);
      }
    });

    gameCode.addEventListener('input', () => {
      gameCode.value = gameCode.value.toUpperCase();
    });
  </script>
</body>
</html>
